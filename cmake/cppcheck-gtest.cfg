<?xml version="1.0"?>
<!-- cppcheck's own googletest library has no typed tests, and it cannot parse
     a file that uses them without these. -->
<def format="2">
  <define name="TYPED_TEST_SUITE(suite,types,names)" value=""/>
  <define name="TYPED_TEST(suite,name)" value="void __ ## suite ## _ ## name ( )"/>
</def>
